name: Deploy to GCP Cloud Run (Workload Identity Federation)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: cf-hackathon-ai-poc-testin-b1
  GCP_REGION: europe-west3
  GAR_REPOSITORY: talentflow-repo
  CLOUD_RUN_SERVICE: talentflow-app

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run (Scale-to-Zero Enabled)
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE_URI" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --service-account "talentflow-runtime-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},BQ_DATASET=talentflow_analytics" \
            --set-secrets "DATABASE_URL=talentflow-db-url:latest,JWT_SECRET=talentflow-jwt-secret:latest" \
            --quiet
