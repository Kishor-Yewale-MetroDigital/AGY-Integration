name: Cloud SQL Pay-When-In-Use Power Schedule

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Start or Stop the Cloud SQL PostgreSQL instance"
        required: true
        default: "stop"
        type: choice
        options:
          - start
          - stop
  schedule:
    # Automatically stop Cloud SQL every evening at 14:30 UTC (20:00 IST) to prevent idle compute charges
    - cron: "30 14 * * *"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: cf-hackathon-ai-poc-testin-b1
  CLOUDSQL_INSTANCE: talentflow-pg-on-demand

jobs:
  toggle-cloudsql:
    name: Toggle Cloud SQL Activation Policy
    runs-on: ubuntu-24.04
    steps:
      - name: Apply On-Demand Activation Policy
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CICD_SERVICE_ACCOUNT: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            KEY_FILE="$(mktemp)"
            printf '%s' "$GCP_SA_KEY" > "$KEY_FILE"
            gcloud auth activate-service-account --key-file="$KEY_FILE" --project="${{ env.GCP_PROJECT_ID }}" --quiet
            rm -f "$KEY_FILE"
          elif [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$GCP_CICD_SERVICE_ACCOUNT" ]; then
            OIDC_TOKEN_FILE="$(mktemp)"
            CRED_CONFIG_FILE="$(mktemp)"
            curl -sSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${GCP_WIF_PROVIDER}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])" > "$OIDC_TOKEN_FILE"
            gcloud iam workload-identity-pools create-cred-config "${GCP_WIF_PROVIDER}" \
              --service-account="${GCP_CICD_SERVICE_ACCOUNT}" \
              --credential-source-file="$OIDC_TOKEN_FILE" \
              --output-file="$CRED_CONFIG_FILE" \
              --quiet
            gcloud auth login --cred-file="$CRED_CONFIG_FILE" --project="${{ env.GCP_PROJECT_ID }}" --quiet
          else
            echo "Skipping Cloud SQL schedule toggle: Neither GCP_WIF_PROVIDER nor GCP_SA_KEY secret is configured in GitHub repository secrets."
            exit 0
          fi

          ACTION="${{ github.event.inputs.action || 'stop' }}"
          if [ "$ACTION" = "start" ]; then
            echo "Starting Cloud SQL instance ${{ env.CLOUDSQL_INSTANCE }} (activation-policy=ALWAYS)..."
            gcloud sql instances patch "${{ env.CLOUDSQL_INSTANCE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --activation-policy=ALWAYS \
              --quiet
          else
            echo "Stopping Cloud SQL instance ${{ env.CLOUDSQL_INSTANCE }} (activation-policy=NEVER -> $0 compute billing)..."
            gcloud sql instances patch "${{ env.CLOUDSQL_INSTANCE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --activation-policy=NEVER \
              --quiet
          fi
