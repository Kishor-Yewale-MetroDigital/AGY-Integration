name: TalentFlow CI — Tests, Lint & Build

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (FastAPI + PostgreSQL + Pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentflow
          POSTGRES_PASSWORD: talentflow_ci_password
          POSTGRES_DB: talentflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install backend dependencies (Python 3.12)
        working-directory: backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run Ruff Linter
        working-directory: backend
        run: .venv/bin/ruff check app tests

      - name: Run Alembic Migrations against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://talentflow:talentflow_ci_password@localhost:5432/talentflow_test
        run: .venv/bin/alembic upgrade head

      - name: Run Pytest Unit, Integration & 19 Acceptance Scenarios
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://talentflow:talentflow_ci_password@localhost:5432/talentflow_test
          TALENTFLOW_ENV: test
        run: .venv/bin/pytest -v --tb=short

  frontend-tests:
    name: Frontend (React + TypeScript + Vitest)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Verify Node.js & Install Frontend Dependencies
        working-directory: frontend
        run: |
          node --version
          npm --version
          npm install

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test -- --run

      - name: Production Bundle Build Check
        working-directory: frontend
        run: npm run build
